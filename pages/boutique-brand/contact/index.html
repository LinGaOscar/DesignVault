            <h1 class="section-title">預約展示</h1>
        </div>
    </section>

    <section class="py-5">
        <div class="container">
            <div class="row g-5">
                <div class="col-12 col-lg-4">
                    <p class="section-tag mb-3">預約展示</p>
                    <h2 class="section-title mb-4">與我們聯繫</h2>
                    <p class="text-muted mb-4" style="font-size:0.875rem;line-height:1.9;">我們提供私人展示服務，歡迎預約了解最新系列。</p>
                    <div class="d-flex flex-column gap-3 small text-muted">

                        <div>📞 +886 2 2345 6789</div>

                            <label class="section-tag d-block mb-2">姓名</label>

                            <input type="email" class="au-input w-100" placeholder="email@example.com">
                        </div>
                        <div>
                            <label class="section-tag d-block mb-2">偏好日期</label>
                            <input type="date" class="au-input w-100">
                        </div>
                        <div>
                            <label class="section-tag d-block mb-2">備註</label>
                            <textarea class="au-input w-100" rows="4" placeholder="請說明您的需求或問題..."></textarea>
                        </div>
                        <div>
                            <button type="submit" class="btn-au">送出預約</button>
                        </div>

                </div>
            </div>
        </div>
