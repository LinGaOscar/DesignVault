<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusFlow — 設定</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../custom.css">
</head>
<body>
<div class="nf-layout">

    <!-- 側邊欄 -->
    <aside class="nf-sidebar" id="sidebar">
        <a href="../../../index.html" class="dv-back">← DesignVault</a>
        <div class="sidebar-logo">NexusFlow</div>
        <p class="nav-group-title">主頁</p>
        <nav class="nav flex-column">
            <a class="nav-link" href="../">📊 儀表板</a>
            <a class="nav-link" href="../analytics/">📈 分析</a>
        </nav>
        <p class="nav-group-title">管理</p>
        <nav class="nav flex-column">
            <a class="nav-link" href="../users/">👥 用戶</a>
            <a class="nav-link" href="../orders/">📦 訂單</a>
        </nav>
        <p class="nav-group-title">系統</p>
        <nav class="nav flex-column">
            <a class="nav-link active" href="./">⚙️ 設定</a>
        </nav>
    </aside>

    <!-- 主要內容 -->
    <main class="nf-main">

        <!-- 頂部導覽列 -->
        <header class="nf-topbar d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <button class="btn p-0 border-0 d-md-none" style="color:var(--nf-text);font-size:1.25rem;" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
                <h1 class="fs-6 fw-normal mb-0">帳號設定</h1>
            </div>
        </header>

        <div class="p-4">

            <!-- Bootstrap nav-tabs -->
            <ul class="nav nav-tabs mb-0" id="settingsTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="account-tab" data-bs-toggle="tab" data-bs-target="#account" type="button" role="tab">帳號設定</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="notify-tab" data-bs-toggle="tab" data-bs-target="#notify" type="button" role="tab">通知設定</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="security-tab" data-bs-toggle="tab" data-bs-target="#security" type="button" role="tab">安全性</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="danger-tab" data-bs-toggle="tab" data-bs-target="#danger" type="button" role="tab">危險操作</button>
                </li>
            </ul>

            <div class="tab-content" id="settingsTabContent">

                <!-- 帳號設定 -->
                <div class="tab-pane fade show active" id="account" role="tabpanel">
                    <div class="card p-4" style="max-width:600px;">
                        <h6 class="mb-4">個人資料</h6>
                        <div class="d-flex align-items-center gap-3 mb-4">
                            <div class="rounded-circle d-flex align-items-center justify-content-center" style="width:56px;height:56px;background:var(--nf-blue);color:#fff;font-size:1.25rem;font-weight:500;">JD</div>
                            <div>
                                <button class="btn-nf-outline" style="padding:6px 14px;font-size:0.8rem;">更換頭像</button>
                                <p class="small mt-1 mb-0" style="color:var(--nf-text-muted);">支援 JPG、PNG，最大 2MB</p>
                            </div>
                        </div>
                        <form>
                            <div class="row g-3">
                                <div class="col-sm-6">
                                    <label class="form-label">姓名</label>
                                    <input type="text" class="form-control" value="John Doe">
                                </div>
                                <div class="col-sm-6">
                                    <label class="form-label">顯示名稱</label>
                                    <input type="text" class="form-control" value="JohnD">
                                </div>
                                <div class="col-12">
                                    <label class="form-label">電子郵件</label>
                                    <input type="email" class="form-control" value="john.doe@nexusflow.com">
                                </div>
                                <div class="col-sm-6">
                                    <label class="form-label">介面語言</label>
                                    <select class="form-select">
                                        <option selected>繁體中文</option>
                                        <option>English</option>
                                        <option>日本語</option>
                                        <option>한국어</option>
                                    </select>
                                </div>
                                <div class="col-sm-6">
                                    <label class="form-label">時區</label>
                                    <select class="form-select">
                                        <option selected>Asia/Taipei (UTC+8)</option>
                                        <option>Asia/Tokyo (UTC+9)</option>
                                        <option>UTC (UTC+0)</option>
                                        <option>America/New_York (UTC-5)</option>
                                    </select>
                                </div>
                                <div class="col-12 mt-2">
                                    <button type="submit" class="btn-nf">儲存變更</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 通知設定 -->
                <div class="tab-pane fade" id="notify" role="tabpanel">
                    <div class="card p-4" style="max-width:600px;">
                        <h6 class="mb-4">電子郵件通知</h6>
                        <div class="d-flex flex-column gap-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <p class="mb-0" style="font-size:0.875rem;">新訂單通知</p>
                                    <p class="small mb-0" style="color:var(--nf-text-muted);">有新訂單時發送通知</p>
                                </div>
                                <div class="form-check form-switch mb-0">
                                    <input class="form-check-input" type="checkbox" checked style="background-color:var(--nf-blue);border-color:var(--nf-blue);">
                                </div>
                            </div>
                            <hr style="border-color:var(--nf-border);margin:0;">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <p class="mb-0" style="font-size:0.875rem;">系統警報</p>
                                    <p class="small mb-0" style="color:var(--nf-text-muted);">伺服器異常或效能警告</p>
                                </div>
                                <div class="form-check form-switch mb-0">
                                    <input class="form-check-input" type="checkbox" checked style="background-color:var(--nf-blue);border-color:var(--nf-blue);">
                                </div>
                            </div>
                            <hr style="border-color:var(--nf-border);margin:0;">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <p class="mb-0" style="font-size:0.875rem;">每週報告</p>
                                    <p class="small mb-0" style="color:var(--nf-text-muted);">每週一寄送數據摘要</p>
                                </div>
                                <div class="form-check form-switch mb-0">
                                    <input class="form-check-input" type="checkbox">
                                </div>
                            </div>
                            <hr style="border-color:var(--nf-border);margin:0;">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <p class="mb-0" style="font-size:0.875rem;">行銷更新</p>
                                    <p class="small mb-0" style="color:var(--nf-text-muted);">產品更新與新功能通知</p>
                                </div>
                                <div class="form-check form-switch mb-0">
                                    <input class="form-check-input" type="checkbox">
                                </div>
                            </div>
                        </div>
                        <div class="mt-4">
                            <button class="btn-nf">儲存通知設定</button>
                        </div>
                    </div>
                </div>

                <!-- 安全性 -->
                <div class="tab-pane fade" id="security" role="tabpanel">
                    <div class="card p-4" style="max-width:600px;">
                        <h6 class="mb-4">變更密碼</h6>
                        <form>
                            <div class="d-flex flex-column gap-3">
                                <div>
                                    <label class="form-label">目前密碼</label>
                                    <input type="password" class="form-control" placeholder="輸入目前密碼">
                                </div>
                                <div>
                                    <label class="form-label">新密碼</label>
                                    <input type="password" class="form-control" placeholder="至少 8 個字元">
                                </div>
                                <div>
                                    <label class="form-label">確認新密碼</label>
                                    <input type="password" class="form-control" placeholder="再次輸入新密碼">
                                </div>
                                <div>
                                    <button type="submit" class="btn-nf">更新密碼</button>
                                </div>
                            </div>
                        </form>
                        <hr style="border-color:var(--nf-border);margin:1.5rem 0;">
                        <h6 class="mb-3">雙因素驗證 (2FA)</h6>
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <p class="mb-0" style="font-size:0.875rem;">啟用 2FA</p>
                                <p class="small mb-0" style="color:var(--nf-text-muted);">使用驗證器 App 提升帳號安全</p>
                            </div>
                            <button class="btn-nf-outline">設定 2FA</button>
                        </div>
                    </div>
                </div>

                <!-- 危險操作 -->
                <div class="tab-pane fade" id="danger" role="tabpanel">
                    <div style="max-width:600px;">
                        <div class="danger-zone">
                            <h6 class="mb-1" style="color:var(--nf-red);">刪除帳號</h6>
                            <p class="small mb-3" style="color:var(--nf-text-muted);">
                                此操作無法復原。刪除後，您的所有資料（包含訂單記錄、分析數據及設定）將被永久移除，無法找回。
                            </p>
                            <button
                                class="btn"
                                style="background:rgba(248,81,73,0.15);color:var(--nf-red);border:1px solid rgba(248,81,73,0.4);font-size:0.8rem;padding:8px 16px;border-radius:6px;"
                                onclick="return confirm('確定要永久刪除帳號？此操作無法復原。')">
                                永久刪除帳號
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
